<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CarVault | Замовлення оформлено</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/purchase-success.css">

</head>


<body>


<header class="navbar">

    <div class="container nav-content">

        <a href="index.html" class="logo">
            CAR<span>VAULT</span>
        </a>


        <nav class="nav-links">

            <a href="index.html">
                Головна
            </a>

            <a href="cars.html">
                Автомобілі
            </a>

            <a href="finance.html">
                Фінансування
            </a>

            <a href="about.html">
                Про нас
            </a>

            <a href="contact.html">
                Контакти
            </a>

        </nav>


        <div class="nav-actions">

            <a
                href="favourites.html"
                class="favourites"
                aria-label="Обране">
                ♡
            </a>


            <a
                href="cart.html"
                class="cart-link"
                aria-label="Кошик">

                🛒

                <span
                    id="cart-count"
                    class="cart-count">
                    0
                </span>

            </a>


            <a
                href="login.html"
                class="login-btn">
                Увійти
            </a>

        </div>

    </div>

</header>



<main class="success-page">

    <div class="container">

        <section class="success-box">


            <div class="success-icon">
                ✓
            </div>


            <h1>
                Замовлення успішно оформлено!
            </h1>


            <p class="success-message">
                Дякуємо за ваше замовлення.
                Це демонстраційна покупка — реальна оплата
                не здійснювалася.
            </p>


            <div class="order-number-box">

                <span>
                    Номер замовлення
                </span>

                <strong id="order-number">
                    CV-000000
                </strong>

            </div>


            <div class="success-details">

                <h2>
                    Деталі замовлення
                </h2>

                <div id="success-cars">
                    <!-- Автомобілі з'являться тут -->
                </div>

            </div>


            <div class="success-buttons">

                <a
                    href="cars.html"
                    class="success-primary-button">

                    Переглянути автомобілі

                </a>


                <a
                    href="index.html"
                    class="success-secondary-button">

                    На головну

                </a>

            </div>


        </section>

    </div>

</main>


<script src="js/main.js"></script>
<script src="js/purchase-success.js"></script>

</body>

</html>
